<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-labelledby="title desc">
  <title id="title">Three line-circle positions</title>
  <desc id="desc">Disjoint, tangent, and secant cases determined by d and r</desc>
  <defs>
    <style>
      .circle{fill:#f8fbff;stroke:#243447;stroke-width:3}
      .line{stroke:#e76f51;stroke-width:4;stroke-linecap:round}
      .dist{stroke:#2a9d8f;stroke-width:3;stroke-dasharray:6 5}
      .point{fill:#243447}
      .txt{font:18px Arial,sans-serif;fill:#14213d;text-anchor:middle}
      .small{font:16px Arial,sans-serif;fill:#2a9d8f}
      .right{fill:none;stroke:#2a9d8f;stroke-width:2}
    </style>
  </defs>
  <g transform="translate(0,0)">
    <circle class="circle" cx="120" cy="100" r="58"/>
    <line class="line" x1="35" y1="177" x2="205" y2="177"/>
    <line class="dist" x1="120" y1="100" x2="120" y2="177"/>
    <path class="right" d="M120 165H132V177"/>
    <circle class="point" cx="120" cy="100" r="4"/>
    <text class="small" x="130" y="143">d</text>
    <text class="small" x="104" y="94">O</text>
    <text class="small" x="195" y="170">l</text>
    <text class="txt" x="120" y="222">d &gt; r</text>
  </g>
  <g transform="translate(240,0)">
    <circle class="circle" cx="120" cy="100" r="58"/>
    <line class="line" x1="35" y1="158" x2="205" y2="158"/>
    <line class="dist" x1="120" y1="100" x2="120" y2="158"/>
    <path class="right" d="M120 146H132V158"/>
    <circle class="point" cx="120" cy="100" r="4"/>
    <circle class="point" cx="120" cy="158" r="5"/>
    <text class="small" x="130" y="133">d</text>
    <text class="small" x="104" y="94">O</text>
    <text class="small" x="195" y="151">l</text>
    <text class="txt" x="120" y="222">d = r</text>
  </g>
  <g transform="translate(480,0)">
    <circle class="circle" cx="120" cy="100" r="58"/>
    <line class="line" x1="35" y1="130" x2="205" y2="130"/>
    <line class="dist" x1="120" y1="100" x2="120" y2="130"/>
    <path class="right" d="M120 118H132V130"/>
    <circle class="point" cx="120" cy="100" r="4"/>
    <text class="small" x="130" y="119">d</text>
    <text class="small" x="104" y="94">O</text>
    <text class="small" x="195" y="123">l</text>
    <text class="txt" x="120" y="222">d &lt; r</text>
  </g>
</svg>
