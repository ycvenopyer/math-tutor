<svg xmlns="http://www.w3.org/2000/svg" width="330" height="310" viewBox="0 0 330 310" role="img" aria-labelledby="title desc">
  <title id="title">Half-angle model in a square</title>
  <desc id="desc">Square ABCD with E on BC, F on CD, angle EAF equal to 45&#176;rees, and intersections M and N on diagonal BD.</desc>
  <defs><style>.edge{fill:none;stroke:#334155;stroke-width:3}.ray{fill:none;stroke:#2563eb;stroke-width:3}.diag{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 5}.point{fill:#dc2626}.label{font:19px Arial,sans-serif;fill:#0f172a}.angle{fill:none;stroke:#f59e0b;stroke-width:3}</style></defs>
  <rect class="edge" x="35" y="30" width="230" height="230"/>
  <line class="diag" x1="35" y1="260" x2="265" y2="30"/>
  <line class="ray" x1="35" y1="30" x2="115" y2="260"/>
  <line class="ray" x1="35" y1="30" x2="265" y2="141"/>
  <line class="edge" x1="115" y1="260" x2="265" y2="141"/>
  <path class="angle" d="M49 69A42 42 0 0 1 73 48"/>
  <g class="point"><circle cx="35" cy="30" r="4.5"/><circle cx="35" cy="260" r="4.5"/><circle cx="265" cy="260" r="4.5"/><circle cx="265" cy="30" r="4.5"/><circle cx="115" cy="260" r="4.5"/><circle cx="265" cy="141" r="4.5"/><circle cx="94" cy="201" r="4.5"/><circle cx="186" cy="109" r="4.5"/></g>
  <g class="label"><text x="18" y="24">A</text><text x="15" y="284">B</text><text x="271" y="284">C</text><text x="271" y="24">D</text><text x="106" y="286">E</text><text x="273" y="145">F</text><text x="72" y="209">M</text><text x="191" y="101">N</text><text x="70" y="75">45°</text></g>
</svg>
