<svg xmlns="http://www.w3.org/2000/svg" width="340" height="290" viewBox="0 0 340 290" role="img" aria-labelledby="title desc">
  <title id="title">Perpendicular construction in a right triangle</title>
  <desc id="desc">Right triangle ABC with midpoint O of hypotenuse AB, E on AC, F on BC, OE perpendicular to OF, and feet D and H.</desc>
  <defs><style>.edge{fill:none;stroke:#334155;stroke-width:3;stroke-linejoin:round}.active{fill:none;stroke:#2563eb;stroke-width:3}.aux{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 5}.point{fill:#dc2626}.label{font:19px Arial,sans-serif;fill:#0f172a}.mark{fill:none;stroke:#f59e0b;stroke-width:2.5}</style></defs>
  <path class="edge" d="M120 40L40 200L280 120Z"/>
  <path class="mark" d="M108 64L132 76L144 52"/>
  <line class="active" x1="160" y1="160" x2="96" y2="88"/>
  <line class="active" x1="160" y1="160" x2="232" y2="96"/>
  <line class="aux" x1="160" y1="160" x2="80" y2="120"/>
  <line class="aux" x1="160" y1="160" x2="200" y2="80"/>
  <path class="mark" d="M151 149L163 138L174 150"/>
  <g class="point"><circle cx="120" cy="40" r="4.5"/><circle cx="40" cy="200" r="4.5"/><circle cx="280" cy="120" r="4.5"/><circle cx="160" cy="160" r="4.5"/><circle cx="96" cy="88" r="4.5"/><circle cx="232" cy="96" r="4.5"/><circle cx="80" cy="120" r="4.5"/><circle cx="200" cy="80" r="4.5"/></g>
  <g class="label"><text x="112" y="28">C</text><text x="20" y="224">A</text><text x="286" y="126">B</text><text x="151" y="184">O</text><text x="80" y="82">E</text><text x="239" y="94">F</text><text x="59" y="124">D</text><text x="204" y="72">H</text></g>
</svg>
