<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Five circle-circle positions</title>
  <desc id="desc">External disjoint, external tangent, intersecting, internal tangent, and contained cases</desc>
  <defs>
    <style>
      .c1{fill:#e8f4f8;fill-opacity:.65;stroke:#243447;stroke-width:3}
      .c2{fill:#ffe8df;fill-opacity:.65;stroke:#e76f51;stroke-width:3}
      .axis{stroke:#8d99ae;stroke-width:2;stroke-dasharray:6 5}
      .point{fill:#14213d}
      .txt{font:18px Arial,sans-serif;fill:#14213d;text-anchor:middle}
    </style>
  </defs>
  <g transform="translate(0,0)">
    <line class="axis" x1="40" y1="105" x2="245" y2="105"/>
    <circle class="c1" cx="90" cy="105" r="48"/><circle class="c2" cx="205" cy="105" r="34"/>
    <circle class="point" cx="90" cy="105" r="4"/><circle class="point" cx="205" cy="105" r="4"/>
    <text class="txt" x="145" y="180">d &gt; R + r</text>
  </g>
  <g transform="translate(300,0)">
    <line class="axis" x1="40" y1="105" x2="245" y2="105"/>
    <circle class="c1" cx="90" cy="105" r="48"/><circle class="c2" cx="172" cy="105" r="34"/>
    <circle class="point" cx="90" cy="105" r="4"/><circle class="point" cx="172" cy="105" r="4"/>
    <text class="txt" x="145" y="180">d = R + r</text>
  </g>
  <g transform="translate(600,0)">
    <line class="axis" x1="40" y1="105" x2="245" y2="105"/>
    <circle class="c1" cx="100" cy="105" r="55"/><circle class="c2" cx="170" cy="105" r="45"/>
    <circle class="point" cx="100" cy="105" r="4"/><circle class="point" cx="170" cy="105" r="4"/>
    <text class="txt" x="145" y="180">R-r &lt; d &lt; R+r</text>
  </g>
  <g transform="translate(140,200)">
    <line class="axis" x1="35" y1="80" x2="250" y2="80"/>
    <circle class="c1" cx="130" cy="80" r="70"/><circle class="c2" cx="170" cy="80" r="30"/>
    <circle class="point" cx="130" cy="80" r="4"/><circle class="point" cx="170" cy="80" r="4"/>
    <text class="txt" x="145" y="175">d = R - r</text>
  </g>
  <g transform="translate(470,200)">
    <line class="axis" x1="35" y1="80" x2="250" y2="80"/>
    <circle class="c1" cx="130" cy="80" r="70"/><circle class="c2" cx="155" cy="80" r="26"/>
    <circle class="point" cx="130" cy="80" r="4"/><circle class="point" cx="155" cy="80" r="4"/>
    <text class="txt" x="145" y="175">d &lt; R - r</text>
  </g>
</svg>
