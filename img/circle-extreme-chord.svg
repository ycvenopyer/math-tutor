<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
<title id="title">Chord length and distance to center</title>
<desc id="desc">The perpendicular OM bisects chord AB and forms a right triangle.</desc>
<defs><style>.g{fill:none;stroke:#334155;stroke-width:3}.a{fill:none;stroke:#2563eb;stroke-width:4}.p{fill:#dc2626}.t{font:20px Arial,sans-serif;fill:#0f172a}.s{font:18px Arial,sans-serif;fill:#475569}</style></defs>
<circle class="g" cx="260" cy="160" r="120"/>
<line class="a" x1="164" y1="232" x2="356" y2="232"/>
<line class="g" x1="260" y1="160" x2="260" y2="232"/>
<line class="g" x1="260" y1="160" x2="356" y2="232"/>
<path class="g" d="M260 214h18v18"/>
<circle class="p" cx="260" cy="160" r="6"/><circle class="p" cx="164" cy="232" r="6"/><circle class="p" cx="356" cy="232" r="6"/><circle class="p" cx="260" cy="232" r="6"/>
<text class="t" x="240" y="150">O</text><text class="t" x="142" y="258">A</text><text class="t" x="358" y="258">B</text><text class="t" x="244" y="260">M</text>
<text class="s" x="274" y="196">d</text><text class="s" x="318" y="184">r</text>
<text class="t" x="440" y="118">AM = MB</text><text class="t" x="440" y="162">AB = 2 sqrt(r^2 - d^2)</text><text class="s" x="440" y="208">smaller d -&gt; longer AB</text>
</svg>
