<svg xmlns="http://www.w3.org/2000/svg" width="380" height="280" viewBox="0 0 380 280" role="img" aria-labelledby="title desc">
  <title id="title">Flying-fish similarity model</title>
  <desc id="desc">Triangle ABC with median AD, line CEF, and auxiliary line DM parallel to CF.</desc>
  <defs>
    <style>
      .main{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .aux{fill:none;stroke:#2563eb;stroke-width:3;stroke-dasharray:8 6;stroke-linecap:round}
      .point{fill:#dc2626}
      .label{font:20px Arial,sans-serif;fill:#0f172a}
    </style>
  </defs>
  <path class="main" d="M180 25L25 245H345Z"/>
  <line class="main" x1="180" y1="25" x2="180" y2="245"/>
  <line class="main" x1="345" y1="245" x2="100" y2="135"/>
  <line class="aux" x1="180" y1="245" x2="60" y2="188"/>
  <g class="point">
    <circle cx="180" cy="25" r="5"/><circle cx="25" cy="245" r="5"/>
    <circle cx="345" cy="245" r="5"/><circle cx="180" cy="245" r="5"/>
    <circle cx="180" cy="171" r="5"/><circle cx="100" cy="135" r="5"/>
    <circle cx="60" cy="188" r="5"/>
  </g>
  <g class="label">
    <text x="171" y="18">A</text><text x="7" y="266">B</text>
    <text x="349" y="266">C</text><text x="171" y="268">D</text>
    <text x="187" y="174">E</text><text x="83" y="128">F</text>
    <text x="39" y="190">M</text>
  </g>
</svg>
