    <style>.edge{fill:none;stroke:#334155;stroke-width:3;stroke-linejoin:round}.left{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.right{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.point{fill:#dc2626}.label{font:20px Arial,sans-serif;fill:#0f172a}.arc{fill:none;stroke:#f59e0b;stroke-width:3}</style>
