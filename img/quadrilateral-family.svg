<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Special quadrilateral family</title>
  <desc id="desc">A compact relationship diagram for parallelogram, rectangle, rhombus, and square with a labeled quadrilateral.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker>
    <style>.box{fill:#fff;stroke:#2563eb;stroke-width:2}.sq{fill:#eff6ff;stroke:#7c3aed;stroke-width:3}.arr{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.shape{stroke:#0f766e;stroke-width:3;fill:#ccfbf1;fill-opacity:.65}.diag{stroke:#f97316;stroke-width:2;stroke-dasharray:6 4}.txt{font:16px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#475569;text-anchor:middle}.label{font:15px Arial,sans-serif;fill:#0f172a}</style>
  </defs>
  <rect width="760" height="340" rx="16" fill="#f8fafc"/>
  <g>
    <rect class="box" x="45" y="35" width="170" height="52" rx="10"/><text class="txt" x="130" y="67">Parallelogram</text>
    <rect class="box" x="45" y="144" width="170" height="52" rx="10"/><text class="txt" x="130" y="176">Rectangle</text>
    <rect class="box" x="285" y="35" width="170" height="52" rx="10"/><text class="txt" x="370" y="67">Rhombus</text>
    <rect class="sq" x="285" y="144" width="170" height="52" rx="10"/><text class="txt" x="370" y="176">Square</text>
    <path class="arr" d="M130 88V140"/><text class="small" x="184" y="120">one right angle</text>
    <path class="arr" d="M218 61H280"/><text class="small" x="249" y="48">equal sides</text>
    <path class="arr" d="M370 88V140"/><text class="small" x="429" y="120">one right angle</text>
    <path class="arr" d="M218 170H280"/><text class="small" x="249" y="157">equal sides</text>
  </g>
  <g transform="translate(500 45)">
    <path class="shape" d="M45 35L205 35L165 220L5 220Z"/>
    <path class="diag" d="M45 35L165 220M205 35L5 220"/>
    <circle cx="105" cy="127.5" r="5" fill="#f97316"/>
    <text class="label" x="31" y="28">A</text><text class="label" x="210" y="28">B</text>
    <text class="label" x="170" y="238">C</text><text class="label" x="-8" y="238">D</text>
    <text class="label" x="112" y="124">O</text>
    <text class="small" x="105" y="266">AO=OC, BO=OD</text>
  </g>
</svg>
