<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Ceva and Menelaus theorem diagrams</title>
  <desc id="desc">Left: three cevians AD, BE and CF concur at P. Right: D, E and F are collinear on the side lines of triangle ABC.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(35,20)">
      <rect x="0" y="0" width="540" height="450" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="270" y="42" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">CEVA</text>
      <path d="M270 75 L70 380 L470 380 Z" stroke="#172554" stroke-width="4"/>
      <path d="M270 75 L270 380 M70 380 L371 229 M470 380 L169 229" stroke="#2563eb" stroke-width="3"/>
      <circle cx="270" cy="75" r="6" fill="#172554"/>
      <circle cx="70" cy="380" r="6" fill="#172554"/>
      <circle cx="470" cy="380" r="6" fill="#172554"/>
      <circle cx="270" cy="380" r="6" fill="#2563eb"/>
      <circle cx="371" cy="229" r="6" fill="#2563eb"/>
      <circle cx="169" cy="229" r="6" fill="#2563eb"/>
      <circle cx="270" cy="280" r="7" fill="#dc2626"/>
      <g fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">
        <text x="270" y="66" text-anchor="middle">A</text>
        <text x="50" y="405">B</text>
        <text x="478" y="405">C</text>
        <text x="270" y="408" text-anchor="middle">D</text>
        <text x="389" y="226">E</text>
        <text x="146" y="226">F</text>
        <text x="282" y="275">P</text>
      </g>
      <text x="270" y="435" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">AD, BE, CF concurrent</text>
    </g>
    <g transform="translate(625,20)">
      <rect x="0" y="0" width="540" height="450" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="270" y="42" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">MENELAUS</text>
      <path d="M250 75 L70 380 L455 380 Z" stroke="#172554" stroke-width="4"/>
      <path d="M35 380 L500 380 M250 75 L525 445" stroke="#94a3b8" stroke-width="2"/>
      <path d="M116 303 L490 432" stroke="#dc2626" stroke-width="4"/>
      <circle cx="250" cy="75" r="6" fill="#172554"/>
      <circle cx="70" cy="380" r="6" fill="#172554"/>
      <circle cx="455" cy="380" r="6" fill="#172554"/>
      <circle cx="116" cy="303" r="7" fill="#dc2626"/>
      <circle cx="340" cy="380" r="7" fill="#dc2626"/>
      <circle cx="490" cy="432" r="7" fill="#dc2626"/>
      <g fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">
        <text x="250" y="66" text-anchor="middle">A</text>
        <text x="50" y="405">B</text>
        <text x="449" y="405">C</text>
        <text x="97" y="295">F</text>
        <text x="340" y="372" text-anchor="middle">D</text>
        <text x="502" y="434">E</text>
      </g>
      <text x="270" y="435" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">D, E, F collinear</text>
    </g>
  </g>
</svg>
