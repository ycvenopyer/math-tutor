<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-label="Intersection of -2 less or equal x and x less than 3">
  <defs>
    <style>
      .a{stroke:#243447;stroke-width:2.5;fill:none}
      .r{stroke:#c45c26;stroke-width:5;fill:none}
      .p{fill:#243447}
      .closed{fill:#c45c26;stroke:#c45c26;stroke-width:2}
      .open{fill:#fff;stroke:#c45c26;stroke-width:2.5}
      .t{font:15px Arial,sans-serif;fill:#17202a}
      .s{font:13px Arial,sans-serif;fill:#475569}
    </style>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#243447"/>
    </marker>
  </defs>
  <line class="a" x1="40" y1="95" x2="600" y2="95" marker-end="url(#arr2)"/>
  <g class="p">
    <circle cx="100" cy="95" r="3.5"/>
    <circle cx="180" cy="95" r="3.5"/>
    <circle cx="260" cy="95" r="3.5"/>
    <circle cx="340" cy="95" r="3.5"/>
    <circle cx="420" cy="95" r="3.5"/>
    <circle cx="500" cy="95" r="3.5"/>
    <circle cx="580" cy="95" r="3.5"/>
  </g>
  <line class="r" x1="180" y1="95" x2="500" y2="95"/>
  <circle class="closed" cx="180" cy="95" r="7"/>
  <circle class="open" cx="500" cy="95" r="7"/>
  <g class="t">
    <text x="88" y="123">-3</text>
    <text x="168" y="123">-2</text>
    <text x="248" y="123">-1</text>
    <text x="332" y="123">0</text>
    <text x="412" y="123">1</text>
    <text x="492" y="123">2</text>
    <text x="572" y="123">3</text>
    <text x="608" y="101">x</text>
  </g>
  <text class="s" x="200" y="36">-2 d x &lt; 3 (closed at -2, open at 3)</text>
  <text class="s" x="160" y="58">common part of x e -2 and x &lt; 3</text>
</svg>
