<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-label="Solution set of x greater than -1">
  <defs>
    <style>
      .a{stroke:#243447;stroke-width:2.5;fill:none}
      .r{stroke:#c45c26;stroke-width:4;fill:none}
      .p{fill:#243447}
      .o{fill:#fff;stroke:#c45c26;stroke-width:2.5}
      .t{font:15px Arial,sans-serif;fill:#17202a}
      .s{font:13px Arial,sans-serif;fill:#475569}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#243447"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c45c26"/>
    </marker>
  </defs>
  <line class="a" x1="40" y1="80" x2="600" y2="80" marker-end="url(#arr)"/>
  <g class="p">
    <circle cx="120" cy="80" r="3.5"/>
    <circle cx="200" cy="80" r="3.5"/>
    <circle cx="280" cy="80" r="3.5"/>
    <circle cx="360" cy="80" r="3.5"/>
    <circle cx="440" cy="80" r="3.5"/>
    <circle cx="520" cy="80" r="3.5"/>
  </g>
  <line class="r" x1="280" y1="80" x2="575" y2="80" marker-end="url(#arr-r)"/>
  <circle class="o" cx="280" cy="80" r="7"/>
  <g class="t">
    <text x="108" y="108">-3</text>
    <text x="188" y="108">-2</text>
    <text x="268" y="108">-1</text>
    <text x="352" y="108">0</text>
    <text x="432" y="108">1</text>
    <text x="512" y="108">2</text>
    <text x="608" y="86">x</text>
  </g>
  <text class="s" x="300" y="36">x &gt; -1 (open circle, ray to the right)</text>
</svg>
