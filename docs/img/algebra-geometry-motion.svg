<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Moving point on a broken path</title>
<desc id="desc">Point P moves from A to B to C, producing two intervals in time.</desc>
<defs><style>.g{fill:none;stroke:#334155;stroke-width:4}.a{fill:none;stroke:#2563eb;stroke-width:5}.p{fill:#dc2626}.t{font:20px Arial,sans-serif;fill:#0f172a}.s{font:17px Arial,sans-serif;fill:#475569}.v{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
<path class="g" d="M90 220H390V70"/>
<path class="a" d="M90 220H390V70" marker-end="url(#m)"/>
<circle class="p" cx="90" cy="220" r="6"/><circle class="p" cx="390" cy="220" r="6"/><circle class="p" cx="390" cy="70" r="6"/><circle class="p" cx="270" cy="220" r="7"/>
<text class="t" x="72" y="250">A</text><text class="t" x="398" y="248">B</text><text class="t" x="400" y="68">C</text><text class="t" x="258" y="250">P</text>
<line class="g" x1="500" y1="230" x2="500" y2="60"/><line class="g" x1="500" y1="230" x2="690" y2="230"/>
<path class="a" d="M500 230L610 120H680"/>
<line class="v" x1="610" y1="230" x2="610" y2="120"/>
<text class="s" x="477" y="66">S</text><text class="s" x="684" y="252">t</text><text class="s" x="592" y="260">at B</text>
</svg>
