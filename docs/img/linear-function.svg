<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Linear function y=kx+b geometric meaning of k and b">
  <defs>
    <style>
      .ax{stroke:#243447;stroke-width:2;fill:none}
      .l{stroke:#1d4ed8;stroke-width:2.5;fill:none}
      .r{stroke:#c2410c;stroke-width:2;fill:none}
      .d{stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
      .t{font:15px Arial,sans-serif;fill:#17202a}
      .s{font:13px Arial,sans-serif;fill:#475569}
      .p{fill:#1d4ed8}
      .q{fill:#c2410c}
    </style>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#243447"/></marker>
  </defs>
  <line class="ax" x1="40" y1="260" x2="480" y2="260" marker-end="url(#arr2)"/>
  <line class="ax" x1="120" y1="330" x2="120" y2="30" marker-end="url(#arr2)"/>
  <text class="t" x="488" y="266">x</text>
  <text class="t" x="128" y="28">y</text>
  <text class="t" x="102" y="278">O</text>
  <!-- y = (1/2)x + 2  : intercept at (0,2)~(120,180), slope rise 2 over run 4 units of 40px = 80px rise for 160px run -->
  <!-- unit = 40px; b=2 -> y=260-80=180; from x=0 to x=4: rise=2, y=180-80=100, x=120+160=280 -->
  <line class="l" x1="40" y1="300" x2="440" y2="100"/>
  <!-- intercept B(0,b) -->
  <circle class="p" cx="120" cy="180" r="5"/>
  <text class="t" x="128" y="172">B(0,b)</text>
  <!-- slope triangle: from (120,180) go right 2 units (80px) to (200,180), up 1 unit (40px) to (200,140) which is on line: y = 0.5*2+2=3 -> 260-120=140 yes -->
  <path class="r" d="M120 180 H200 V140"/>
  <text class="s" x="148" y="198">1 (run)</text>
  <text class="s" x="208" y="168">k (rise)</text>
  <circle class="q" cx="200" cy="140" r="4"/>
  <text class="s" x="300" y="88">y = kx + b (k&gt;0)</text>
  <text class="s" x="300" y="108">k = rise / run</text>
  <text class="s" x="300" y="128">b = y-intercept</text>
</svg>
