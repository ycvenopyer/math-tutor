<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Line and circle positions">
  <defs>
    <style>
      .L{stroke:#243447;stroke-width:2.2;fill:none}
      .c{stroke:#243447;stroke-width:2.2;fill:none}
      .dist{stroke:#1d4ed8;stroke-width:2;fill:none}
      .line{stroke:#c2410c;stroke-width:2.4;fill:none}
      .t{font:14px Arial,sans-serif;fill:#17202a}
      .s{font:13px Arial,sans-serif;fill:#475569}
      .p{fill:#243447}
    </style>
  </defs>
  <!-- d > r -->
  <circle class="c" cx="110" cy="110" r="55"/>
  <line class="line" x1="20" y1="220" x2="200" y2="220"/>
  <line class="dist" x1="110" y1="110" x2="110" y2="220"/>
  <path class="L" d="M110 205 H125 V220" stroke-width="1.6"/>
  <circle class="p" cx="110" cy="110" r="3"/>
  <text class="t" x="118" y="106">O</text>
  <text class="t" x="118" y="168" fill="#1d4ed8">d</text>
  <text class="t" x="160" y="100">r</text>
  <text class="s" x="55" y="255">d &gt; r (separate)</text>

  <!-- d = r -->
  <circle class="c" cx="360" cy="130" r="70"/>
  <line class="line" x1="250" y1="200" x2="470" y2="200"/>
  <line class="dist" x1="360" y1="130" x2="360" y2="200"/>
  <path class="L" d="M360 185 H375 V200" stroke-width="1.6"/>
  <circle class="p" cx="360" cy="130" r="3"/>
  <circle class="p" cx="360" cy="200" r="3.5"/>
  <text class="t" x="368" y="126">O</text>
  <text class="t" x="368" y="172" fill="#1d4ed8">d</text>
  <text class="t" x="420" y="120">r</text>
  <text class="t" x="368" y="218">T</text>
  <text class="s" x="300" y="255">d = r (tangent)</text>

  <!-- d < r; half-chord ~74 -->
  <circle class="c" cx="600" cy="130" r="80"/>
  <line class="line" x1="490" y1="160" x2="710" y2="160"/>
  <line class="dist" x1="600" y1="130" x2="600" y2="160"/>
  <path class="L" d="M600 145 H612 V160" stroke-width="1.6"/>
  <circle class="p" cx="600" cy="130" r="3"/>
  <circle class="p" cx="526" cy="160" r="3"/>
  <circle class="p" cx="674" cy="160" r="3"/>
  <text class="t" x="608" y="126">O</text>
  <text class="t" x="608" y="150" fill="#1d4ed8">d</text>
  <text class="t" x="655" y="100">r</text>
  <text class="s" x="540" y="255">d &lt; r (intersect)</text>
</svg>
