<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="SSS congruence of two triangles">
  <defs>
    <style>
      .L{stroke:#243447;stroke-width:2.5;fill:none}
      .t{font:15px Arial,sans-serif;fill:#17202a}
      .s{font:13px Arial,sans-serif;fill:#475569}
      .p{fill:#243447}
      .mk{stroke:#1d4ed8;stroke-width:2}
    </style>
  </defs>
  <!-- ?ABC -->
  <polygon class="L" points="70,250 200,50 330,250"/>
  <!-- single tick on AB and DE -->
  <line class="mk" x1="128" y1="145" x2="142" y2="155"/>
  <line class="mk" x1="458" y1="145" x2="472" y2="155"/>
  <!-- double tick on BC and EF -->
  <line class="mk" x1="258" y1="145" x2="272" y2="155"/>
  <line class="mk" x1="248" y1="150" x2="262" y2="160"/>
  <line class="mk" x1="528" y1="145" x2="542" y2="155"/>
  <line class="mk" x1="518" y1="150" x2="532" y2="160"/>
  <!-- triple-style on CA and FD: short marks across base -->
  <line class="mk" x1="185" y1="258" x2="215" y2="258"/>
  <line class="mk" x1="190" y1="266" x2="220" y2="266"/>
  <line class="mk" x1="195" y1="274" x2="225" y2="274"/>
  <line class="mk" x1="455" y1="258" x2="485" y2="258"/>
  <line class="mk" x1="460" y1="266" x2="490" y2="266"/>
  <line class="mk" x1="465" y1="274" x2="495" y2="274"/>
  <!-- ?DEF -->
  <polygon class="L" points="400,250 530,50 600,250"/>
  <circle class="p" cx="70" cy="250" r="3"/><circle class="p" cx="200" cy="50" r="3"/><circle class="p" cx="330" cy="250" r="3"/>
  <circle class="p" cx="400" cy="250" r="3"/><circle class="p" cx="530" cy="50" r="3"/><circle class="p" cx="600" cy="250" r="3"/>
  <text class="t" x="52" y="272">A</text>
  <text class="t" x="192" y="38">B</text>
  <text class="t" x="336" y="272">C</text>
  <text class="t" x="382" y="272">D</text>
  <text class="t" x="522" y="38">E</text>
  <text class="t" x="606" y="272">F</text>
  <text class="s" x="140" y="292">AB=DE, BC=EF, CA=FD ? ?ABC ? ?DEF (SSS)</text>
</svg>
