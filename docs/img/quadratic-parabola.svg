<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Quadratic parabola in vertex form">
  <defs>
    <style>
      .ax{stroke:#243447;stroke-width:2;fill:none}
      .p{stroke:#7c3aed;stroke-width:2.5;fill:none}
      .sy{stroke:#c2410c;stroke-width:1.8;stroke-dasharray:5 4;fill:none}
      .t{font:15px Arial,sans-serif;fill:#17202a}
      .s{font:13px Arial,sans-serif;fill:#475569}
      .v{fill:#7c3aed}
    </style>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#243447"/></marker>
  </defs>
  <line class="ax" x1="40" y1="280" x2="440" y2="280" marker-end="url(#arr4)"/>
  <line class="ax" x1="120" y1="330" x2="120" y2="30" marker-end="url(#arr4)"/>
  <text class="t" x="448" y="286">x</text>
  <text class="t" x="128" y="28">y</text>
  <text class="t" x="100" y="298">O</text>
  <!-- vertex form y = a(x-h)^2 + k, a>0, vertex V(h,k) at (240,160) -->
  <!-- parabola: from x=h-3 to h+3; scale 40px per unit; aH0.5 -->
  <path class="p" d="M80,300 Q160,220 240,160 Q320,220 400,300"/>
  <!-- axis of symmetry x=h -->
  <line class="sy" x1="240" y1="40" x2="240" y2="320"/>
  <circle class="v" cx="240" cy="160" r="5"/>
  <text class="t" x="250" y="152">V(h,k)</text>
  <text class="s" x="248" y="52">x = h</text>
  <text class="s" x="300" y="100">y = a(x - h)^2 + k</text>
  <text class="s" x="300" y="120">a &gt; 0: opens up</text>
  <text class="s" x="300" y="140">min y = k at x = h</text>
  <!-- mark h on x-axis -->
  <line class="ax" x1="240" y1="274" x2="240" y2="286"/>
  <text class="s" x="232" y="304">h</text>
</svg>
