<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" role="img" aria-labelledby="title desc">
  <title id="title">Quadratic function features</title>
  <desc id="desc">A parabola with vertex, axis of symmetry, and x-intercepts</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#243447"/>
    </marker>
    <style>
      .axis{stroke:#243447;stroke-width:2.5;marker-end:url(#arrow)}
      .grid{stroke:#dfe7ef;stroke-width:1}
      .curve{fill:none;stroke:#e76f51;stroke-width:4}
      .sym{stroke:#2a9d8f;stroke-width:2.5;stroke-dasharray:8 6}
      .guide{stroke:#8d99ae;stroke-width:2;stroke-dasharray:5 5}
      .point{fill:#fff;stroke:#14213d;stroke-width:2.5}
      .txt{font:17px Arial,sans-serif;fill:#14213d}
      .green{fill:#2a9d8f}
    </style>
  </defs>
  <path class="grid" d="M70 80H570 M70 130H570 M70 180H570 M70 230H570 M70 280H570 M120 40V340 M170 40V340 M220 40V340 M270 40V340 M320 40V340 M370 40V340 M420 40V340 M470 40V340 M520 40V340"/>
  <line class="axis" x1="50" y1="280" x2="585" y2="280"/>
  <line class="axis" x1="120" y1="345" x2="120" y2="30"/>
  <line class="sym" x1="320" y1="45" x2="320" y2="335"/>
  <path class="curve" d="M115 38 C185 205 235 330 320 330 C405 330 455 205 525 38"/>
  <line class="guide" x1="320" y1="330" x2="120" y2="330"/>
  <circle class="point" cx="220" cy="280" r="5"/>
  <circle class="point" cx="420" cy="280" r="5"/>
  <circle class="point" cx="320" cy="330" r="5"/>
  <text class="txt" x="575" y="304">x</text>
  <text class="txt" x="96" y="38">y</text>
  <text class="txt green" x="332" y="68">x = h</text>
  <text class="txt" x="178" y="267">(x1, 0)</text>
  <text class="txt" x="430" y="267">(x2, 0)</text>
  <text class="txt" x="332" y="356">V(h, k)</text>
</svg>
