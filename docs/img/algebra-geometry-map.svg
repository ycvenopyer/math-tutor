<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
<title id="title">Algebra and geometry translation map</title>
<desc id="desc">Geometry conditions are translated into variables, equations and checked solutions.</desc>
<defs><style>.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.c{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.t{font:19px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:15px Arial,sans-serif;fill:#475569;text-anchor:middle}.a{fill:none;stroke:#64748b;stroke-width:3}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
<rect class="b" x="30" y="70" width="150" height="105" rx="16"/><rect class="b" x="220" y="70" width="150" height="105" rx="16"/><rect class="b" x="410" y="70" width="150" height="105" rx="16"/><rect class="c" x="600" y="70" width="130" height="105" rx="16"/>
<path class="a" d="M180 122H215" marker-end="url(#m)"/><path class="a" d="M370 122H405" marker-end="url(#m)"/><path class="a" d="M560 122H595" marker-end="url(#m)"/>
<text class="t" x="105" y="108">GEOMETRY</text><text class="s" x="105" y="140">points / lengths</text>
<text class="t" x="295" y="108">VARIABLE</text><text class="s" x="295" y="140">x, t and domain</text>
<text class="t" x="485" y="108">EQUATION</text><text class="s" x="485" y="140">solve / classify</text>
<text class="t" x="665" y="108">CHECK</text><text class="s" x="665" y="140">range / shape</text>
<path class="a" d="M665 184C665 230 105 230 105 184" marker-end="url(#m)"/><text class="s" x="385" y="247">translate back</text>
</svg>
